services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DOMEOKE_BACKEND: ${DOMEOKE_BACKEND:?Run python scripts/docker.py to detect the host GPU, or explicitly set DOMEOKE_BACKEND=cpu for CPU-only execution}
    volumes:
      - .:/app/DOMEOKE-BACKEND
      - model-checkpoints:/app/DOMEOKE-BACKEND/audio_processing/results
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - DOMEOKE_DEVICE=${DOMEOKE_BACKEND:?Select the backend with python scripts/docker.py}
    command: bash /app/DOMEOKE-BACKEND/scripts/run.sh
  # GPU users: python scripts/docker.py (detects host before build and adds devices).

volumes:
  model-checkpoints:
